name: release

# Publishes @openthink/pablo-core, @openthink/pablo-tui and @openthink/pablo (the cli) to npm, in that
# dependency order, all at one version. One trigger:
#   - workflow_dispatch: run it by hand from the Actions tab, on main. The build and publish jobs' `if:` skip any other
#     branch, so a build that never passed the stamp gate on main cannot reach npm with a provenance attestation.
#   There is deliberately no `push: tags` trigger. A tag can point at any commit, including one on a branch that
#   was never reviewed, so a tag-triggered publish would let anyone able to push a tag ship unreviewed code with
#   valid provenance. Do not add one back, even if tags are mirrored (.stamp/mirror.yml).
# It deliberately does NOT run on every push to main: merging this file must not publish, and each package
# needs its npm Trusted Publisher configured for this repo and this workflow filename first
# (npm package -> Settings -> Trusted Publishers).
#
# Auth is OIDC Trusted Publishing, no NPM_TOKEN; --provenance attaches an SLSA attestation. On every run,
# a package whose version is already on npm is skipped, so re-runs (and a partial failure) are safe.
#
# Job layout (least privilege per job; oaudit AGT-2230, modelled on stamp-cli's publish.yml):
#   check    contents: read   installs the workspace, typechecks and tests. Holds no OIDC.
#   build    contents: read   reads the version, packs the three tarballs with `bun pm pack` and uploads them as
#                             an artifact. No dependency install: the packages ship source, and packing reads only
#                             the workspace's package.json files. Holds no OIDC.
#   publish  id-token: write  downloads the tarballs and publishes them. No checkout, no install, no bun, no
#                             package scripts: nothing from the repo or its dependency tree runs while
#                             ACTIONS_ID_TOKEN_REQUEST_* is in the environment. It runs in the `npm-release`
#                             environment, so required reviewers and a main-only deployment rule can be set on
#                             it in the repo settings, and each package's Trusted Publisher can name it.

on:
  workflow_dispatch:

# Every job starts from nothing and holds only what it lists.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Actions are pinned by full commit SHA: the publish job below holds id-token: write.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Bun is the runtime and test runner; installed from npm at a pinned version rather than a third-party action.
      - run: npm install -g bun@1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Tests commit to temp git repos and rely on a configured identity, as a developer machine has.
      - run: git config --global user.name "pablo CI" && git config --global user.email "ci@pablo.invalid"
      # A slow runner gets a per-test budget well above a developer machine's; a test that still overruns fails
      # on its own instead of the job sitting until timeout-minutes cancels it.
      - run: bun test --timeout 30000

  build:
    needs: check
    # workflow_dispatch can be run on any branch; only main is stamp-reviewed, so only main publishes. Both halves
    # are checked so that a trigger added later (a tag push, say) does not publish by default. The same gate is on
    # publish, so neither job runs off main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # bun is needed for `bun pm pack`. Its npm package's own postinstall links the platform binary, so it cannot
      # take --ignore-scripts; it runs here, in a job with no OIDC, at a pinned version. There is deliberately no
      # `bun install`: nothing from the workspace's dependency tree runs in this job.
      - run: npm install -g bun@1.3.13

      # The three packages release in lockstep: one version, so the pinned cross-deps always resolve.
      # package.json values are file content: pass them through env, never ${{ }} into the script.
      - name: read target version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          for pkg in core tui cli; do
            V=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$V" != "$VERSION" ]; then
              echo "packages/$pkg is at $V but packages/cli is at $VERSION; bump all three together" >&2
              exit 1
            fi
          done
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
          else
            DIST_TAG="latest"
          fi
          {
            echo "version<<__EOF_VERSION_$$"
            echo "$VERSION"
            echo "__EOF_VERSION_$$"
            echo "dist_tag<<__EOF_DIST_TAG_$$"
            echo "$DIST_TAG"
            echo "__EOF_DIST_TAG_$$"
          } >> "$GITHUB_OUTPUT"
          echo "target: $VERSION (dist-tag: $DIST_TAG)"

      # No build step: the packages ship source (src/ runs on Bun). `bun pm pack` rewrites the `workspace:*` deps
      # to the concrete versions in the tarball (npm publish from a directory would ship them verbatim and break
      # every install). The cli's prepack/postpack are its own casting-bundle.ts (node builtins only), which copies
      # the casting sources into the tarball. Each tarball is renamed to <pkg>.tgz so the publish job, which has no
      # checkout, finds it without reading package.json.
      - name: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/tarballs"
          mkdir -p "$OUT"
          for pkg in core tui cli; do
            NAME=$(node -p "require('./packages/$pkg/package.json').name")
            (cd "packages/$pkg" && bun pm pack --destination "$OUT")
            FILE="${NAME#@}"
            PACKED="$OUT/${FILE//\//-}-$VERSION.tgz"
            if tar -xOf "$PACKED" package/package.json | grep -q 'workspace:'; then
              echo "$PACKED still has workspace: ranges; refusing to publish." >&2
              exit 1
            fi
            mv "$PACKED" "$OUT/$pkg.tgz"
          done
          ls -l "$OUT"

      - name: upload tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure this environment in the repo settings (required reviewers, deployment branches: main only) and
    # name it in each package's npm Trusted Publisher, so only this job's OIDC token can publish. GitHub creates
    # it unprotected on the first run if it does not exist yet.
    environment: npm-release
    # id-token: write is the only grant: OIDC for npm Trusted Publishing and for --provenance. No contents
    # permission: this job does not check out the repo.
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: download tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs

      # npm 11.5.1+ is needed for OIDC auth on the registry PUT; Node 22 bundles npm 10, so fetch a pinned npm via
      # npx (not @latest: this step holds id-token). Publishing a tarball runs no package scripts; --ignore-scripts
      # makes that explicit. Order is dependency order: core, then tui, then cli. The name and version are read
      # from each tarball's own package.json, and a tarball not at the build job's version is refused.
      - name: publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          set -euo pipefail
          DIR="$RUNNER_TEMP/tarballs"
          for pkg in core tui cli; do
            TARBALL="$DIR/$pkg.tgz"
            if [ ! -f "$TARBALL" ]; then
              echo "no tarball for packages/$pkg" >&2
              exit 1
            fi
            NAME=$(tar -xOf "$TARBALL" package/package.json | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>console.log(JSON.parse(s).name))')
            V=$(tar -xOf "$TARBALL" package/package.json | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
            if [ "$V" != "$VERSION" ]; then
              echo "$TARBALL is $NAME@$V, not $VERSION; refusing to publish." >&2
              exit 1
            fi
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already on npm, skipping."
              continue
            fi
            echo "$NAME@$VERSION not on npm, publishing."
            npx -y npm@11.13.0 publish "$TARBALL" --ignore-scripts --access public --provenance --tag "$DIST_TAG"
          done
