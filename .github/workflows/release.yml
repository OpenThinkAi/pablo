name: release

# Publishes @openthink/pablo-core, @openthink/pablo-tui and @openthink/pablo (the cli) to npm, in that
# dependency order, all at one version. One trigger:
#   - workflow_dispatch: run it by hand from the Actions tab, on main. The publish job's `if:` skips any other
#     branch, so a build that never passed the stamp gate on main cannot reach npm with a provenance attestation.
#   There is deliberately no `push: tags` trigger. A tag can point at any commit, including one on a branch that
#   was never reviewed, so a tag-triggered publish would let anyone able to push a tag ship unreviewed code with
#   valid provenance. Do not add one back, even if tags are mirrored (.stamp/mirror.yml).
# It deliberately does NOT run on every push to main: merging this file must not publish, and each package
# needs its npm Trusted Publisher configured for this repo and this workflow filename first
# (npm package -> Settings -> Trusted Publishers).
#
# Auth is OIDC Trusted Publishing, no NPM_TOKEN; --provenance attaches an SLSA attestation. On every run,
# a package whose version is already on npm is skipped, so re-runs (and a partial failure) are safe.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned by full commit SHA: the publish job below holds id-token: write.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Bun is the runtime and test runner; installed from npm at a pinned version rather than a third-party action.
      - run: npm install -g bun@1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Tests commit to temp git repos and rely on a configured identity, as a developer machine has.
      - run: git config --global user.name "pablo CI" && git config --global user.email "ci@pablo.invalid"
      # A slow runner gets a per-test budget well above a developer machine's; a test that still overruns fails
      # on its own instead of the job sitting until timeout-minutes cancels it.
      - run: bun test --timeout 30000

  publish:
    needs: check
    # workflow_dispatch can be run on any branch; only main is stamp-reviewed, so only main publishes. Both halves
    # are checked so that a trigger added later (a tag push, say) does not publish by default.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g bun@1.3.13
      - run: bun install --frozen-lockfile

      # The three packages release in lockstep: one version, so the pinned cross-deps always resolve.
      # package.json values are file content: pass them through env, never ${{ }} into the script.
      - name: read target version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          for pkg in core tui cli; do
            V=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$V" != "$VERSION" ]; then
              echo "packages/$pkg is at $V but packages/cli is at $VERSION; bump all three together" >&2
              exit 1
            fi
          done
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="${VERSION#*-}"
            DIST_TAG="${DIST_TAG%%.*}"
          else
            DIST_TAG="latest"
          fi
          {
            echo "version<<__EOF_VERSION_$$"
            echo "$VERSION"
            echo "__EOF_VERSION_$$"
            echo "dist_tag<<__EOF_DIST_TAG_$$"
            echo "$DIST_TAG"
            echo "__EOF_DIST_TAG_$$"
          } >> "$GITHUB_OUTPUT"
          echo "target: $VERSION (dist-tag: $DIST_TAG)"

      # No build step: the packages ship source (src/ runs on Bun). `bun pm pack` rewrites the `workspace:*`
      # deps to the concrete versions in the tarball (npm publish from a directory would ship them verbatim and
      # break every install); the tarball is then published with npm, which is what speaks OIDC. npm 11.5.1+ is
      # needed for OIDC auth on the registry PUT; Node 22 bundles npm 10, so fetch a pinned npm via npx (not
      # @latest: this step holds id-token). Order is dependency order: core, then tui, then cli.
      - name: publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/tarballs"
          mkdir -p "$OUT"
          for pkg in core tui cli; do
            NAME=$(node -p "require('./packages/$pkg/package.json').name")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION already on npm, skipping."
              continue
            fi
            echo "$NAME@$VERSION not on npm, publishing."
            (cd "packages/$pkg" && bun pm pack --destination "$OUT")
            FILE="${NAME#@}"
            TARBALL="$OUT/${FILE//\//-}-$VERSION.tgz"
            if tar -xOf "$TARBALL" package/package.json | grep -q 'workspace:'; then
              echo "$TARBALL still has workspace: ranges; refusing to publish." >&2
              exit 1
            fi
            npx -y npm@11.13.0 publish "$TARBALL" --access public --provenance --tag "$DIST_TAG"
          done
