[project]
name = "pablo-casting"
version = "0.1.0"
description = "pablo's casting side: voices, takes and the mix. Run as `python -m pablo_casting <command> --json` by the pablo CLI, never as a user-facing binary."
license = "MIT"
requires-python = ">=3.12,<3.13"
# Runtime dependencies stay light until an engine lands: huggingface_hub is
# only imported by `pull`, the one command that downloads weights.
dependencies = [
    "huggingface-hub>=0.34",
]

# The gate's scorer stack (AGT-1682), installed by pablo on the first `pablo gate`
# that scores audio, never by the default `uv sync` (the tests use fakes). The
# MLX scorers (Whisper, the forced aligner) exist only on Apple Silicon.
# emotion2vec (funasr) is its own extra: its gate is soft and its weights'
# license is unverified (design, "Research: quality gates on Apple Silicon").
[project.optional-dependencies]
scorers = [
    "numpy>=2.0",
    "soundfile>=0.13",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio>=0.5.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.6",
    "torchaudio>=2.6",
    "speechbrain>=1.1.1",
    "audiobox-aesthetics>=0.0.4",
    "speechmos>=0.0.1.1",
    "onnxruntime>=1.20",
    "librosa>=0.10",
]
# funasr pulls modelscope and the Alibaba Cloud SDKs (oss2, aliyun-python-sdk-*)
# transitively; they can reach Alibaba hosts. The scorer loads from the Hugging
# Face hub (`hub="hf"`, `disable_update=True`), the extra is never installed by
# default, and its gate is soft; re-check those three before depending on it.
emotion = [
    "funasr>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pablo_casting"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run (and stamp's `casting-test` check) never loads a model:
# tests that do are marked `models` and run by hand with `-m models`.
addopts = "-m 'not models'"
markers = [
    "models: loads or downloads real model weights; run by hand with `uv run pytest -m models`",
]
